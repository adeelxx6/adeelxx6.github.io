<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authorizing TikTok… — V1 Crosspost</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0f0f0f;color:#fff;display:flex;min-height:100vh;margin:0;align-items:center;justify-content:center;text-align:center;padding:20px;}
  .card{max-width:420px;}
  .spinner{width:44px;height:44px;border:4px solid #333;border-top-color:#25f4ee;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 24px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:1.4rem;margin:0 0 8px;}
  p{color:#aaa;line-height:1.6;margin:0 0 20px;}
  a.btn{display:inline-block;background:#fe2c55;color:#fff;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:600;}
  .small{font-size:.8rem;color:#666;margin-top:24px;}
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Authorizing TikTok…</h1>
    <p>Completing sign-in and returning you to <strong>V1 Cross-Post</strong>. If the app does not open automatically, tap the button below.</p>
    <a class="btn" id="openApp" href="#">Open V1 Cross-Post</a>
    <p class="small">You can close this page once the app has opened.</p>
  </div>

  <script>
    (function () {
      var qs = window.location.search || "";
      var appLink = "com.v1crosspost://tiktok/callback" + qs;
      var btn = document.getElementById("openApp");
      btn.setAttribute("href", appLink);
      try { window.location.replace(appLink); } catch (e) {}
    })();
  </script>
</body>
</html>
